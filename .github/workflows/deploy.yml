name: Build & Deploy Docs

on:
  # Rebuild when the documentation repo changes.
  push:
    branches: [ main ]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:
  # Let the MUES-Core repo trigger a rebuild via a repository_dispatch event
  # (event type "docs-rebuild"). Optional — see README for setup.
  repository_dispatch:
    types: [ docs-rebuild ]

# A single deployment at a time.
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4

      - name: Checkout MUES-Core (package source)
        uses: actions/checkout@v4
        with:
          repository: j0nes-L/MUES-Core
          ref: main
          # Required only if MUES-Core is private. Create a fine-grained PAT with
          # "Contents: read" on MUES-Core and store it as the secret MUES_CORE_TOKEN.
          token: ${{ secrets.MUES_CORE_TOKEN }}
          path: _source/MUES-Core

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Build documentation
        run: |
          docfx metadata docfx.json
          docfx build docfx.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cp vercel.json _site/vercel.json
          vercel deploy _site --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
