name: Build & Deploy Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [ docs-rebuild ]

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4

      - name: Checkout MUES-Core (package source)
        uses: actions/checkout@v4
        with:
          repository: j0nes-L/MUES-Core
          ref: main
          token: ${{ secrets.MUES_CORE_TOKEN }}
          path: _source/MUES-Core

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache dotnet tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: dotnet-tools-docfx-${{ runner.os }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('_source/MUES-Core/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Build documentation
        run: |
          docfx metadata docfx.json
          docfx build docfx.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cp vercel.json _site/vercel.json
          vercel deploy _site --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
